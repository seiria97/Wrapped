<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wrapped — Create something worth opening twice.</title>
<meta name="description" content="A place to turn your words, memories, music, and moments into a gift made for one person." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
</head>

<body>

  <!-- ============ AMBIENT TEXTURE (paper grain, linen, corner florals, dust) ============ -->
  <div class="ambient-texture" aria-hidden="true">
    <div class="light-wash"></div>

    <svg class="grain" width="100%" height="100%">
      <filter id="grainFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
        <feColorMatrix type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.19  0 0 0 0 0.16  0 0 0 0.9 0"></feColorMatrix>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainFilter)"></rect>
    </svg>

    <div class="linen"></div>

    <!-- Pressed-flower silhouettes, blurred, tucked into two corners -->
    <svg class="corner-floral top-left" viewBox="0 0 200 200" fill="none">
      <g opacity="0.8">
        <ellipse cx="70" cy="90" rx="34" ry="14" fill="#B88B84" transform="rotate(20 70 90)"/>
        <ellipse cx="95" cy="70" rx="30" ry="12" fill="#7D8A70" transform="rotate(-25 95 70)"/>
        <ellipse cx="60" cy="60" rx="26" ry="11" fill="#C6A86D" transform="rotate(60 60 60)"/>
        <ellipse cx="100" cy="105" rx="28" ry="12" fill="#5E684D" transform="rotate(100 100 105)"/>
        <circle cx="82" cy="85" r="9" fill="#8B6A58"/>
        <path d="M82 85 C 60 130, 40 150, 20 170" stroke="#5E684D" stroke-width="2" fill="none"/>
      </g>
    </svg>
    <svg class="corner-floral bottom-right" viewBox="0 0 200 200" fill="none">
      <g opacity="0.8">
        <ellipse cx="70" cy="90" rx="38" ry="15" fill="#7D8A70" transform="rotate(15 70 90)"/>
        <ellipse cx="100" cy="65" rx="30" ry="12" fill="#B88B84" transform="rotate(-30 100 65)"/>
        <ellipse cx="55" cy="55" rx="24" ry="10" fill="#C6A86D" transform="rotate(70 55 55)"/>
        <circle cx="80" cy="80" r="10" fill="#8B6A58"/>
        <path d="M80 80 C 100 125, 120 145, 145 165" stroke="#5E684D" stroke-width="2" fill="none"/>
      </g>
    </svg>

    <!-- Slow-drifting dust motes -->
    <span class="dust-mote" style="top:18%; left:22%; width:3px; height:3px; animation-duration:26s;"></span>
    <span class="dust-mote" style="top:32%; left:72%; width:2px; height:2px; animation-duration:32s; animation-delay:2s;"></span>
    <span class="dust-mote" style="top:58%; left:14%; width:2px; height:2px; animation-duration:29s; animation-delay:5s;"></span>
    <span class="dust-mote" style="top:70%; left:80%; width:3px; height:3px; animation-duration:35s; animation-delay:1s;"></span>
    <span class="dust-mote" style="top:44%; left:50%; width:2px; height:2px; animation-duration:30s; animation-delay:8s;"></span>
    <span class="dust-mote" style="top:12%; left:60%; width:2px; height:2px; animation-duration:27s; animation-delay:4s;"></span>
    <span class="dust-mote" style="top:82%; left:40%; width:3px; height:3px; animation-duration:33s; animation-delay:6s;"></span>
  </div>

  <!-- ============ HERO — the entire page ============ -->
  <main class="home-hero">

    <div class="wordmark-wrap fade-rise d1">
      <div class="washi-tape" aria-hidden="true"></div>
      <h1 class="wordmark">Wrapped</h1>
      <span class="accent-script eyebrow-script">for someone you love</span>
    </div>

    <p class="tagline fade-rise d2">Create something worth opening twice.</p>

    <p class="description fade-rise d3">A place to turn your words, memories, music, and moments into a gift made for one person.</p>

    <svg class="stitched-divider fade-rise d3" viewBox="0 0 74 10" aria-hidden="true">
      <line x1="0" y1="5" x2="74" y2="5" stroke="#B88B84" stroke-width="1" stroke-dasharray="3 4"/>
    </svg>

    <a href="create-gift.html" class="btn btn-primary btn-begin fade-rise d4">Begin</a>

    <svg class="wax-seal-corner" viewBox="0 0 46 46" aria-hidden="true">
      <path d="M23 3 C29 3 33 5 36 8 C40 5 44 8 43 13 C46 15 46 20 43 23 C46 27 44 32 40 32 C40 37 36 40 32 38 C29 42 24 42 21 38 C16 40 12 37 13 32 C8 32 6 27 9 23 C6 20 6 15 9 13 C7 8 12 5 16 8 C18 5 20 3 23 3 Z"
            fill="#B88B84" opacity="0.92"/>
      <path d="M23 3 C29 3 33 5 36 8 C40 5 44 8 43 13 C46 15 46 20 43 23 C46 27 44 32 40 32 C40 37 36 40 32 38 C29 42 24 42 21 38 C16 40 12 37 13 32 C8 32 6 27 9 23 C6 20 6 15 9 13 C7 8 12 5 16 8 C18 5 20 3 23 3 Z"
            fill="none" stroke="#8B6A58" stroke-width="0.6" opacity="0.5"/>
      <path d="M23 15 C19 11 13 14 13 19 C13 24 18 28 23 33 C28 28 33 24 33 19 C33 14 27 11 23 15 Z"
            fill="#F7F1E7" opacity="0.7"/>
    </svg>

  </main>

</body>
</html>

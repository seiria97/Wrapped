<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose an Occasion — Wrapped</title>
<meta name="description" content="Choose an occasion and begin writing a personalized keepsake on Wrapped." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
</head>

<body>

  <!-- ============ AMBIENT TEXTURE (shared across every page) ============ -->
  <div class="ambient-texture" aria-hidden="true">
    <div class="light-wash"></div>
    <svg class="grain" width="100%" height="100%">
      <filter id="grainFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
        <feColorMatrix type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.19  0 0 0 0 0.16  0 0 0 0.9 0"></feColorMatrix>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainFilter)"></rect>
    </svg>
    <div class="linen"></div>
    <svg class="corner-floral top-left" viewBox="0 0 200 200" fill="none">
      <g opacity="0.8">
        <ellipse cx="70" cy="90" rx="34" ry="14" fill="#B88B84" transform="rotate(20 70 90)"/>
        <ellipse cx="95" cy="70" rx="30" ry="12" fill="#7D8A70" transform="rotate(-25 95 70)"/>
        <ellipse cx="60" cy="60" rx="26" ry="11" fill="#C6A86D" transform="rotate(60 60 60)"/>
        <circle cx="82" cy="85" r="9" fill="#8B6A58"/>
      </g>
    </svg>
    <svg class="corner-floral bottom-right" viewBox="0 0 200 200" fill="none">
      <g opacity="0.8">
        <ellipse cx="70" cy="90" rx="38" ry="15" fill="#7D8A70" transform="rotate(15 70 90)"/>
        <ellipse cx="100" cy="65" rx="30" ry="12" fill="#B88B84" transform="rotate(-30 100 65)"/>
        <circle cx="80" cy="80" r="10" fill="#8B6A58"/>
      </g>
    </svg>
    <span class="dust-mote" style="top:16%; left:10%; width:2px; height:2px; animation-duration:28s;"></span>
    <span class="dust-mote" style="top:30%; left:90%; width:3px; height:3px; animation-duration:33s; animation-delay:3s;"></span>
    <span class="dust-mote" style="top:64%; left:6%; width:2px; height:2px; animation-duration:31s; animation-delay:6s;"></span>
    <span class="dust-mote" style="top:78%; left:85%; width:2px; height:2px; animation-duration:29s; animation-delay:2s;"></span>
  </div>

  <!-- ============ NAV — wordmark only ============ -->
  <header class="site-nav">
    <a href="index.html" class="wordmark-link">Wrapped</a>
  </header>

  <main>

    <!-- ============ PAGE HERO ============ -->
    <section class="page-hero">
      <div class="page-hero-inner fade-rise d1">
        <h1>Choose the occasion.</h1>
        <p class="lead">Every gift starts with a moment worth marking.</p>

        <div class="step-progress">
          <div class="step active"><span class="dot">1</span> Occasion</div>
          <span class="connector"></span>
          <div class="step"><span class="dot">2</span> Recipient</div>
          <span class="connector"></span>
          <div class="step"><span class="dot">3</span> Customize</div>
        </div>
      </div>
    </section>

    <!-- ============ OCCASION PICKER — a stationery collection, not app cards ============ -->
    <section class="occasion-picker" aria-label="Choose an occasion">
      <div class="occasion-grid" id="occasionGrid">

        <button type="button" class="stationery-card fade-rise d2" data-occasion="Birthday">
          <div class="wash" style="background:var(--rose)"></div>
          <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21h16v-8a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4z"/>
            <path d="M9 9V7c0-1 .5-1.8 1-2.5C10.6 3.6 10.8 3 10.3 2c-.6.6-1.3 1.7-1.3 2.5 0 .6.4 1 1 1"/>
            <path d="M15 9V7c0-1 .5-1.8 1-2.5"/>
            <line x1="4" y1="15" x2="20" y2="15"/>
          </svg>
          <div class="title">Birthday</div>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></span>
        </button>

        <button type="button" class="stationery-card fade-rise d2" data-occasion="Love" style="transition-delay:.05s">
          <div class="wash" style="background:var(--rose)"></div>
          <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20.5c-4.8-3-9-6.6-9-11A5 5 0 0 1 12 6a5 5 0 0 1 9 3.5c0 4.4-4.2 8-9 11z"/>
          </svg>
          <div class="title">Love</div>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></span>
        </button>

        <button type="button" class="stationery-card fade-rise d2" data-occasion="Congratulations" style="transition-delay:.1s">
          <div class="wash" style="background:var(--gold)"></div>
          <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 21l3-9 9-9 3 3-9 9z"/>
            <path d="M8 12l4 4"/>
            <circle cx="18" cy="4" r="1"/>
            <circle cx="21" cy="9" r="1"/>
            <circle cx="15" cy="2.5" r="1"/>
          </svg>
          <div class="title">Congratulations</div>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></span>
        </button>

        <button type="button" class="stationery-card fade-rise d3" data-occasion="Graduation">
          <div class="wash" style="background:var(--olive)"></div>
          <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 9l10-5 10 5-10 5z"/>
            <path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>
            <path d="M22 9v6"/>
          </svg>
          <div class="title">Graduation</div>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></span>
        </button>

        <button type="button" class="stationery-card fade-rise d3" data-occasion="Just Because" style="transition-delay:.05s">
          <div class="wash" style="background:var(--sage)"></div>
          <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21c0-6-4-8-4-12a4 4 0 0 1 8 0c0 4-4 6-4 12z"/>
            <path d="M12 9V5"/>
          </svg>
          <div class="title">Just Because</div>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></span>
        </button>

        <button type="button" class="stationery-card fade-rise d3" data-occasion="Anniversary" style="transition-delay:.1s">
          <div class="wash" style="background:var(--mocha)"></div>
          <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="12" r="5"/>
            <circle cx="15" cy="12" r="5"/>
          </svg>
          <div class="title">Anniversary</div>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></span>
        </button>

      </div>
    </section>

    <!-- ============ RECIPIENT ============ -->
    <section class="recipient-section">
      <div class="recipient-card paper-card fade-rise d4">
        <label class="field-label" for="recipientName">Who is this gift for?</label>
        <input type="text" class="field-input" id="recipientName" name="recipientName" placeholder="Their name" autocomplete="off">
      </div>
    </section>

    <!-- ============ STICKY CONTINUE BAR ============ -->
    <div class="continue-bar">
      <span class="hint" id="selectionHint">Choose an occasion to continue</span>
      <a href="editor.html" class="btn btn-primary" id="continueBtn" aria-disabled="true">Continue →</a>
    </div>

  </main>

<script src="create-gift.js"></script>
</body>
</html>
